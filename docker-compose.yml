version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traficcycliste
    ports:
      - "8501:8501"
    volumes:
      - ./files/data:/usr/local/app/data
      - ./files/prediction:/usr/local/app/prediction
    command: streamlit run homePage.py
